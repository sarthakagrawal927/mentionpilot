name = "mentionpilot-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets" }
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[vars]
NODE_ENV = "production"
NEXTAUTH_URL = "https://mention.highsignal.app"
BETTER_AUTH_URL = "https://mention.highsignal.app"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "mentionpilot-db"
database_id = "50564400-a892-48b5-a2f9-1357fa409e0a"

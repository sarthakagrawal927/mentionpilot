name = "mentionpilot-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ENVIRONMENT = "production"
# Free check — single OpenAI-compatible endpoint, set in Cloudflare dashboard
# FREE_AI_ENDPOINT_URL = ""
# FREE_AI_API_KEY = ""
# FREE_AI_MODEL = ""
# Legacy free check keys (deprecated — use FREE_AI_* instead)
# OPENAI_API_KEY = ""
# GOOGLE_API_KEY = ""

[triggers]
crons = ["0 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mentionpilot-db"
database_id = "628e1584-aa4a-4181-96ad-3fd234c88498"
migrations_dir = "../../packages/db/migrations"
